name: Sync YouSail marine-diesel providers

on:
  workflow_dispatch:
  schedule:
    # Daily check; actual sync is due every five days across month boundaries.
    - cron: "29 0 * * *"

permissions:
  contents: write

concurrency:
  group: sync-yousail-marine-diesel-engine
  cancel-in-progress: false

jobs:
  cadence:
    name: Check five-day cadence
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      due: ${{ steps.interval.outputs.due }}
    steps:
      - name: Check whether the sync is due
        id: interval
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const day = 86400000;
          const anchor = Date.parse('2026-09-30T00:00:00Z');
          const elapsedDays = Math.floor((Date.now() - anchor) / day);
          const due = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch'
            || (elapsedDays > 0 && elapsedDays % 5 === 0);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `due=${due}\n`);
          console.log(due ? 'Sync is due.' : 'Not due; marina sync skipped.');
          NODE
  sync:
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replace provider membership from YouSail
        run: npm run sync:yousail
        env:
          YOUSAIL_CONTENT_API_SECRET: ${{ secrets.YOUSAIL_CONTENT_API_SECRET }}
      - name: Verify sync and site
        run: npm run test:sync && npm run check && npm run build
      - name: Commit a changed snapshot
        run: |
          if git diff --quiet -- data/yousail-providers.json; then
            echo "Snapshot already current."
            exit 0
          fi
          git config user.name "yousail-sync[bot]"
          git config user.email "yousail-sync[bot]@users.noreply.github.com"
          git add data/yousail-providers.json
          git commit -m "Sync marine-diesel providers from YouSail"
          git push origin HEAD:main
